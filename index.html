<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sahu Kirana & Restaurant</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" href="4c788179-bf9a-4776-8165-35933ee9efd5 (1) (1).png">  
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

        body { 
            background: linear-gradient(125deg, #ff2a54, #9000ff, #0072ff, #00eccd, #ff7300);
            background-size: 400% 400%;
            animation: multiColorWave 15s ease infinite;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            position: relative;
        }

        @keyframes multiColorWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-box { 
            background: rgba(255, 255, 255, 0.12); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 40px 30px; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 90%; 
            max-width: 380px; 
            text-align: center; 
            z-index: 10;
        }

        h2 { color: #ffffff; margin-bottom: 10px; font-size: 26px; }
        p { color: rgba(255, 255, 255, 0.8); font-size: 14px; margin-bottom: 30px; }

        .google-btn { 
            width: 100%; 
            padding: 14px; 
            background: #ffffff; 
            color: #333333; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 15px;
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .google-btn:hover { 
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.4);
        }

        .google-icon { width: 22px; height: 22px; }

        #errorMessage { 
            color: #ff2a54; 
            font-size: 13px; 
            margin-top: 20px; 
            font-weight: bold; 
            display: none; 
            background: rgba(255, 42, 84, 0.15);
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🏪 Sahu Hotel</h2>
        <p>Sign in to access store & rate calculator</p>
        
        <button id="googleSignInBtn" class="google-btn">
            <svg class="google-icon" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Sign in with Google
        </button>

        <div id="errorMessage"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAr9wY7_SbxrHjOYlvZwmuzwp-QIXGaq-k",
            authDomain: "sahu-hotel-22ad4.firebaseapp.com",
            projectId: "sahu-hotel-22ad4",
            storageBucket: "sahu-hotel-22ad4.firebasestorage.app",
            messagingSenderId: "289705794339",
            appId: "1:289705794339:web:77d89c9a259428add08a96",
            measurementId: "G-M2C64ZTB8D"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const btn = document.getElementById('googleSignInBtn');
        const errorDiv = document.getElementById('errorMessage');

        if (localStorage.getItem('currentUser')) {
            window.location.replace("home.html");
        }

        btn.addEventListener('click', () => {
            btn.innerText = "Connecting Google...";
            btn.disabled = true;

            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    const email = (user.email || '').toLowerCase().trim();
                    const name = user.displayName || 'Tanmay Sahu';

                    localStorage.setItem('currentUser', name);
                    localStorage.setItem('userEmail', email);

                    // Boss Check (Checks tanmaysahu652 or tanmay)
                    if (email.includes("tanmaysahu652") || email.includes("tanmay")) {
                        localStorage.setItem('userRole', 'admin');
                    } else {
                        localStorage.setItem('userRole', 'customer');
                    }

                    window.location.replace("home.html");
                })
                .catch((error) => {
                    btn.innerHTML = `Sign in with Google`;
                    btn.disabled = false;
                    errorDiv.style.display = 'block';
                    errorDiv.innerText = "Login Error: " + error.message;
                });
        });
    </script>
</body>
</html>
